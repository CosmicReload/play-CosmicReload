# Builds the installer from the tagged source on GitHub's own machines and publishes it as a release, with a signed
# build-provenance attestation, so anyone can check the download was built from this repository:
#   gh attestation verify PlayCosmicReloadSetup.exe --repo CosmicReload/play-CosmicReload
# Release: set Config.Version in app/PlayCosmicReload.cs, commit, then push a matching tag (git tag v1.2.3 && git push origin v1.2.3).
name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write      # create the release
  id-token: write      # sign the attestation
  attestations: write  # store the attestation

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '8'

      - name: Check the tag matches Config.Version
        shell: pwsh
        run: |
          $version = [regex]::Match((Get-Content app/PlayCosmicReload.cs -Raw), 'Version = "([0-9.]+)"').Groups[1].Value
          if ("v$version" -ne "${{ github.ref_name }}") { throw "Tag ${{ github.ref_name }} does not match Config.Version $version" }

      - name: Install NSIS
        shell: pwsh
        run: |
          if (-not (Test-Path "${env:ProgramFiles(x86)}\NSIS\makensis.exe")) { choco install nsis -y --no-progress }

      - name: Build
        shell: pwsh
        run: ./build.ps1

      - uses: actions/attest-build-provenance@v2
        with:
          subject-path: |
            dist/PlayCosmicReloadSetup.exe
            dist/play-cosmicreload.json

      - name: Publish the release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = '${{ github.ref_name }}'
          $sha = (Get-FileHash dist/PlayCosmicReloadSetup.exe -Algorithm SHA256).Hash.ToLowerInvariant()
          $notes = @(
            "**Install:** download ``PlayCosmicReloadSetup.exe`` below (or from https://cosmicreload.com/download/cosmic-client/), run it, open Play CosmicReload and press Play. Installed copies update themselves.",
            '',
            "Built from the source at this tag by [this workflow run](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}).",
            'Check that your download came from it:',
            '```',
            'gh attestation verify PlayCosmicReloadSetup.exe --repo ${{ github.repository }}',
            '```',
            "SHA-256: ``$sha``",
            '',
            'Not code-signed yet: if Windows shows "Windows protected your PC", click More info, then Run anyway.'
          ) -join "`n"
          gh release create $tag dist/PlayCosmicReloadSetup.exe dist/play-cosmicreload.json --title "Play CosmicReload $($tag.Substring(1))" --notes $notes --latest
